services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      PRICE_GETTER_CONFIG: /data/config.yml
      PRICE_GETTER_DB_URL: sqlite:////data/price_getter.db
      PRICE_GETTER_HOST: 0.0.0.0
      PRICE_GETTER_PORT: "8000"
    volumes:
      - ./data:/data
      - ./data/config.yml:/data/config.yml
      - ./data/price_getter.db:/data/price_getter.db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/products', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PRICE_GETTER_PUBLIC_PORT:-80}:80"
    volumes:
      - ./nginx/price-getter.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/.htpasswd-price-getter:/etc/nginx/.htpasswd-price-getter:ro
    restart: unless-stopped
