sources:
  digikala_api:
    adapter: digikala_api
    timeout_seconds: 20
    rate_limit_seconds: 3
    currency: IRR
    price_multiplier: 1
    headers:
      User-Agent: price-getter/0.1 (+https://example.local)
  digikala_web:
    adapter: digikala_web
    timeout_seconds: 20
    rate_limit_seconds: 3
    currency: IRR
    price_multiplier: 1
    headers:
      User-Agent: price-getter/0.1 (+https://example.local)
  generic_demo:
    adapter: generic_html
    timeout_seconds: 15
    rate_limit_seconds: 2
    currency: TOMAN
    price_multiplier: 10
    settings:
      selectors:
        title: h1.product-title
        price: .price
        seller: .seller
        availability: .availability
  brsapi_market:
    adapter: brsapi_market
    timeout_seconds: 15
    rate_limit_seconds: 2
    currency: TOMAN
    price_multiplier: 10
    settings:
      api_key_env: brsapi_api
      cache_ttl_seconds: 30

