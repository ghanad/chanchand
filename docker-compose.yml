services:
  app:
    container_name: price-getter-app
    image: ghanad/chanchand:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PRICE_GETTER_PUBLIC_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
