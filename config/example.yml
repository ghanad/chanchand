sources:
  digikala:
    adapter: digikala
    timeout_seconds: 20
    rate_limit_seconds: 3
    currency: IRR
    price_multiplier: 1
    headers:
      User-Agent: "price-getter/0.1 (+https://example.local)"

  generic_demo:
    adapter: generic_html
    timeout_seconds: 15
    rate_limit_seconds: 2
    currency: TOMAN
    price_multiplier: 10
    settings:
      selectors:
        title: "h1.product-title"
        price: ".price"
        seller: ".seller"
        availability: ".availability"

products:
  example-phone:
    title: "Example phone"
  chair1:
    title: "Digikala chair 1"

targets:
  - product_key: chair1
    source_key: digikala
    url: "https://www.digikala.com/product/dkp-3271540/"
    enabled: true
